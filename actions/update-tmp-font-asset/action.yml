name: 'Update TMP Font Asset'
description: 'Updates TextMeshPro FontAsset registered characters by calling TMP_FontAsset.TryAddCharacters.'
author: 'AndanteTribe'
inputs:
  font-asset-paths:
    description: 'Newline-separated paths to TMP FontAsset files (.asset), relative to the repository root.'
    required: true
  characters:
    description: 'Characters to add to the font assets.'
    required: true
  include-font-features:
    description: 'Whether to include font features when adding characters.'
    default: 'false'
    required: false
  unity-license:
    description: 'Unity license XML content (UNITY_LICENSE).'
    required: true
outputs:
  result:
    description: 'Whether all font assets were updated successfully (true or false).'
    value: ${{ steps.read-result.outputs.result }}
  missing-characters:
    description: 'Characters that could not be added to the font assets.'
    value: ${{ steps.read-result.outputs.missing-characters }}
runs:
  using: 'composite'
  steps:
    - name: Prepare temp directory
      shell: bash
      env:
        FONT_ASSET_PATHS: ${{ inputs.font-asset-paths }}
        CHARACTERS: ${{ inputs.characters }}
        UNITY_LICENSE: ${{ inputs.unity-license }}
      run: |
        TMP="${{ github.workspace }}/_TmpFontUpdater"
        mkdir -p "${TMP}/Assets/TmpFontUpdater" "${TMP}/result"

        # Copy font assets into the bind-mount directory
        while IFS= read -r line || [ -n "$line" ]; do
          path=$(echo "$line" | xargs)
          [ -z "$path" ] && continue
          src="${{ github.workspace }}/${path}"
          filename=$(basename "$path")
          cp "$src" "${TMP}/Assets/TmpFontUpdater/${filename}"
          [ -f "${src}.meta" ] && cp "${src}.meta" "${TMP}/Assets/TmpFontUpdater/${filename}.meta"
        done <<< "$FONT_ASSET_PATHS"

        # Build pipe-separated asset paths (relative to project root inside the image)
        PATHS_ARG=""
        while IFS= read -r line || [ -n "$line" ]; do
          path=$(echo "$line" | xargs)
          [ -z "$path" ] && continue
          filename=$(basename "$path")
          asset_path="Assets/TmpFontUpdater/${filename}"
          if [ -z "$PATHS_ARG" ]; then
            PATHS_ARG="$asset_path"
          else
            PATHS_ARG="${PATHS_ARG}|${asset_path}"
          fi
        done <<< "$FONT_ASSET_PATHS"

        CHARS_B64=$(printf '%s' "$CHARACTERS" | base64 | tr -d '\n')

        {
          echo "fontAssetPaths=${PATHS_ARG}"
          echo "characters=${CHARS_B64}"
          echo "includeFontFeatures=${{ inputs.include-font-features }}"
        } > "${TMP}/params.txt"

        # Write Unity license to a file to avoid passing large XML through env vars
        printf '%s' "${UNITY_LICENSE}" > "${TMP}/unity_lic.ulf"

    - name: Get image owner
      id: image-owner
      shell: bash
      run: |
        echo "value=$(echo '${{ github.action_repository }}' | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Run FontAsset updater
      shell: bash
      run: |
        TMP="${{ github.workspace }}/_TmpFontUpdater"
        # Activate license (non-zero is expected on some Unity versions), run updater, return license
        docker run --rm \
          -v "${TMP}/unity_lic.ulf:/tmp/unity_lic.ulf:ro" \
          -v "${TMP}/Assets/TmpFontUpdater:/root/project/Assets/TmpFontUpdater" \
          -v "${TMP}/params.txt:/root/project/tmp-font-update-params.txt:ro" \
          -v "${TMP}/result:/tmp/font-result" \
          "ghcr.io/${{ steps.image-owner.outputs.value }}/ugui-base:latest" \
          bash -ec '
            /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile /dev/stdout -manualLicenseFile /tmp/unity_lic.ulf && echo "License activation succeeded" || echo "License activation returned non-zero (may still be valid)"
            /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile /dev/stdout -projectPath /root/project -executeMethod AndanteTribe.TextMeshPro.Editor.FontAssetUpdater.InsertCharacters
            cp /root/project/tmp-font-asset-result.txt /tmp/font-result/
            /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile /dev/stdout -returnLicense && echo "License returned" || echo "License return returned non-zero (non-fatal)"
          '

    - name: Read result and set outputs
      id: read-result
      shell: bash
      run: |
        RESULT_FILE="${{ github.workspace }}/_TmpFontUpdater/result/tmp-font-asset-result.txt"
        if [ -f "$RESULT_FILE" ]; then
          result=$(sed -n 's/^result=//p' "$RESULT_FILE")
          missing=$(sed -n 's/^missingCharacters=//p' "$RESULT_FILE")
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "missing-characters=${missing}" >> "$GITHUB_OUTPUT"
        else
          echo "result=false" >> "$GITHUB_OUTPUT"
          echo "missing-characters=" >> "$GITHUB_OUTPUT"
        fi

    - name: Copy modified assets back
      shell: bash
      env:
        FONT_ASSET_PATHS: ${{ inputs.font-asset-paths }}
      run: |
        TMP="${{ github.workspace }}/_TmpFontUpdater"
        while IFS= read -r line || [ -n "$line" ]; do
          path=$(echo "$line" | xargs)
          [ -z "$path" ] && continue
          dst="${{ github.workspace }}/${path}"
          filename=$(basename "$path")
          cp "${TMP}/Assets/TmpFontUpdater/${filename}" "$dst"
        done <<< "$FONT_ASSET_PATHS"

    - name: Cleanup
      if: always()
      shell: bash
      run: rm -rf "${{ github.workspace }}/_TmpFontUpdater"

