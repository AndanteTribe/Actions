name: 'Static Analysis'
description: 'Run static analysis tools (actionlint, ghalint, zizmor, ghasec) for GitHub Actions workflows'
author: 'AndanteTribe'
inputs:
  token:
    description: 'GitHub token for API requests'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    # see: https://github.com/rhysd/actionlint
    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: 1.7.12
      run: |
        mkdir -p "$RUNNER_TEMP/actionlint"
        curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          | tar -xzf - -C "$RUNNER_TEMP/actionlint" actionlint
        echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
    - name: Run actionlint
      shell: bash
      run: actionlint

    # see: https://github.com/suzuki-shunsuke/ghalint
    - name: Install ghalint
      shell: bash
      env:
        GHALINT_VERSION: 1.5.6
      run: |
        mkdir -p "$RUNNER_TEMP/ghalint"
        curl -sSfL "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz" \
          | tar -xzf - -C "$RUNNER_TEMP/ghalint" ghalint
        echo "$RUNNER_TEMP/ghalint" >> "$GITHUB_PATH"
    - name: Run ghalint
      shell: bash
      run: ghalint run

    # see: https://github.com/zizmorcore/zizmor
    - name: Install zizmor
      shell: bash
      env:
        ZIZMOR_VERSION: 1.25.2
      run: |
        mkdir -p "$RUNNER_TEMP/zizmor"
        curl -sSfL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xzf - -C "$RUNNER_TEMP/zizmor" zizmor
        echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"
    - name: Run zizmor
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: zizmor .

    # see: https://github.com/koki-develop/ghasec-action
    - name: Run ghasec
      uses: koki-develop/ghasec-action@4393b9e47c8e13e8d0d3bf6325766cf7e88182fa # v1.1.0
      with:
        github-token: ${{ inputs.token }}
