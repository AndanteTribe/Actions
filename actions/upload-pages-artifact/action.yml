name: 'Upload GitHub Pages Artifact'
description: 'A composite action that prepares your static assets to be deployed to GitHub Pages'
author: 'AndanteTribe'
inputs:
  name:
    description: 'Artifact name'
    required: false
    default: 'github-pages'
  path:
    description: 'Path of the directory containing the static assets.'
    required: true
    default: '_site/'
  retention-days:
    description: 'Duration after which artifact will expire in days.'
    required: false
    default: '1'
  include-hidden-files:
    description: 'Include hidden files and directories (those starting with a dot) in the artifact. Excludes .git and .github regardless.'
    required: false
    default: 'false'
outputs:
  artifact_id:
    description: 'The ID of the artifact that was uploaded.'
    value: ${{ steps.upload-pages-artifact.outputs.artifact_id }}
runs:
  using: 'composite'
  steps:
    # see: https://github.com/actions/upload-pages-artifact
    - id: upload-pages-artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
