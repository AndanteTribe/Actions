version: 2
updates:
  # Maintain workflow and wrapper action dependencies, including new wrappers
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'

  # Maintain pinned Docker image versions in wrapper actions
  - package-ecosystem: docker
    directories:
      - /actions/build-unitypackage
      - /actions/code-coverage-report-update
      - /actions/fetch-unity-info
      - /actions/get-unity-serial
      - /actions/set-outputs
      - /actions/sign-upm-release
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns:
          - '*'

  # Keep the SDK version restriction specific to NuGetForUnity
  - package-ecosystem: docker
    directory: /actions/nugetforunity-restore
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "dotnet/sdk"
        versions:
          - ">= 10.0.0"
