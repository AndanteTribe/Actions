version: 2
updates:
  # Maintain dependencies for GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
    cooldown:
      default-days: 3

  # Maintain pinned versions in wrapper actions (Docker image digests + action SHAs)
  - package-ecosystem: docker
    directory: /actions/build-unitypackage
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/checkout
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/docker-build-push-action
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/docker-login-action
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/docker-metadata-action
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/docker-setup-buildx-action
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /actions/code-coverage-report-update
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/create-github-app-token
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /actions/fetch-unity-info
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /actions/get-unity-serial
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /actions/nugetforunity-restore
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "dotnet/sdk"
        versions:
          - ">= 10.0.0"
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /actions/set-outputs
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/setup-dotnet
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/unity-cache
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/unity-meta-check
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/unity-test-runner
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/upload-artifact
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /actions/static-analysis
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
