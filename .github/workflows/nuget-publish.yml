name: Publish NuGet
run-name: Publish NuGet - ${{ inputs.repository }} (${{ inputs.sha }})

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Source repository (owner/name)'
        required: true
        type: string
      sha:
        description: 'Full source commit SHA'
        required: true
        type: string
      project:
        description: 'Project or solution path relative to the source repository'
        required: false
        default: '.'
        type: string
      dotnet-version:
        description: '.NET SDK version'
        required: false
        default: '10.0.x'
        type: string

permissions: {}

concurrency:
  group: nuget-publish-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AndanteTribe/Actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        # ghasec-ignore: unpinned-action
        uses: AndanteTribe/Actions/actions/checkout@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          path: source
      - name: Setup .NET
        # ghasec-ignore: unpinned-action
        uses: AndanteTribe/Actions/actions/setup-dotnet@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Pack
        working-directory: source
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet pack "./$PROJECT" --configuration Release --output "$GITHUB_WORKSPACE/packages"
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.repository == 'AndanteTribe/Actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # Do not check out or execute caller-supplied source in this privileged job.
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: packages
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: AndanteTribe
      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'packages/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
