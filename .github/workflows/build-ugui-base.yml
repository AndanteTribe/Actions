name: Build and Publish uGUI Base Unity Image
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'src/UGUIBase.Unity/Assets/**'
      - 'src/UGUIBase.Unity/Packages/**'
      - 'src/UGUIBase.Unity/ProjectSettings/**'
  pull_request:
    paths:
      - 'src/UGUIBase.Unity/Assets/**'
      - 'src/UGUIBase.Unity/Packages/**'
      - 'src/UGUIBase.Unity/ProjectSettings/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Unity version
        id: unity-version
        run: |
          version=$(grep "m_EditorVersion:" src/UGUIBase.Unity/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg UNITY_VERSION=${{ steps.unity-version.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/ugui-base:latest \
            -t ghcr.io/${{ github.repository_owner }}/ugui-base:${{ steps.unity-version.outputs.version }} \
            src/UGUIBase.Unity

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ugui-base:latest
          docker push ghcr.io/${{ github.repository_owner }}/ugui-base:${{ steps.unity-version.outputs.version }}

