name: Build and Publish uGUI Base Unity Image
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'src/UGUIBase.Unity/Assets/**'
      - 'src/UGUIBase.Unity/Packages/**'
      - 'src/UGUIBase.Unity/ProjectSettings/**'
  pull_request:
    paths:
      - 'src/UGUIBase.Unity/Assets/**'
      - 'src/UGUIBase.Unity/Packages/**'
      - 'src/UGUIBase.Unity/ProjectSettings/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Unity version
        id: unity-version
        run: |
          version=$(grep "m_EditorVersion:" src/UGUIBase.Unity/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/UGUIBase.Unity
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            UNITY_VERSION=${{ steps.unity-version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.unity-version.outputs.owner }}/ugui-base:latest
            ghcr.io/${{ steps.unity-version.outputs.owner }}/ugui-base:${{ steps.unity-version.outputs.version }}

